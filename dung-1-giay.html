<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thử Thách Bấm Đúng Thời Gian</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap');

        body {
            background: #0f0f0f;
            color: #e0e0e0;
            font-family: 'Roboto Mono', monospace;
            text-align: center;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        h1 { color: #00ffcc; font-size: 2.6rem; margin-bottom: 40px; }

        .controls {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 50px;
            flex-wrap: wrap;
            justify-content: center;
        }

        select, button {
            padding: 14px 22px;
            font-size: 1.35rem;
            border-radius: 10px;
        }

        select {
            background: #1f1f1f;
            color: #00ffcc;
            border: 2px solid #00ccaa;
            min-width: 240px;
        }

        button {
            font-weight: bold;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
        }

        .start { background: #00cc99; color: black; }
        .stop  { background: #ff3366; color: white; }

        #timer {
            font-size: 3.8rem;
            font-weight: 700;
            color: #ffdd00;
            margin: 30px 0;
            min-height: 90px;
            background: #1a1a1a;
            border: 3px solid #333;
            border-radius: 12px;
            width: 520px;
        }

        #result {
            margin-top: 30px;
            font-size: 1.45rem;
            line-height: 1.8;
            max-width: 520px;
            background: #1a1a1a;
            padding: 25px;
            border-radius: 12px;
            border: 2px solid #00ccaa;
        }
    </style>
</head>
<body>
    <h1>THỬ THÁCH THỜI GIAN</h1>
    
    <div class="controls">
        <select id="target">
            <option value="500000000">500 ms</option>
            <option value="1000000000" selected>1 giây</option>
            <option value="2000000000">2 giây</option>
            <option value="5000000000">5 giây</option>
            <option value="10000000000">10 giây</option>
            <option value="15000000000">15 giây</option>
            <option value="20000000000">20 giây</option>
            <option value="60000000000">60 giây</option>
        </select>
        
        <button id="btn" class="start">BẮT ĐẦU</button>
    </div>

    <div id="timer">__________ ns</div>
    <div id="result"></div>

    <script>
        const btn = document.getElementById("btn");
        const timer = document.getElementById("timer");
        const result = document.getElementById("result");
        const targetSelect = document.getElementById("target");

        let running = false;
        let startInstant = null;
        let animationId = null;

        function getChallengeLabel(ns) {
            const seconds = ns / 1000000000;
            if (seconds >= 60) return "60 giây";
            if (seconds >= 1) return Math.round(seconds) + " giây";
            return (ns / 1000000) + " ms";
        }

        function updatePlaceholder() {
            if (!running) return;
            timer.textContent = "__________ ns";
            animationId = requestAnimationFrame(updatePlaceholder);
        }

        function sendToWebhook(offset, targetNs, elapsedNs) {
            const WEBHOOK_URL = atob('aHR0cHM6Ly9kaXNjb3JkLmNvbS9hcGkvd2ViaG9va3MvMTUwMzYzNDM4NzgzMTYyMzgyMy9YeU5nLXByZXI4cFRXSVlzSHZOZWxpMnZhUk1JQ3lDZlk5UVJDVk83bGRBWlVhRmp1Yk1fOWg3cTJ2a0l5MHRibzMtNg==');   // ←←← THAY BẰNG URL WEBHOOK THẬT

            if (WEBHOOK_URL === "url" || !WEBHOOK_URL) {
                log("❌ Chưa thay webhook URL!");
                return;
            }

            const challengeLabel = getChallengeLabel(targetNs);

            // Payload thân thiện với Discord + webhook thông thường
            const payload = {
                content: `🎯 **Kết quả thử thách**`,
                embeds: [{
                    title: "Thử Thách Thời Gian",
                    color: 0x00ffcc,
                    fields: [
                        { name: "Challenge", value: challengeLabel, inline: true },
                        { name: "Mục tiêu", value: targetNs.toLocaleString('vi-VN') + " ns", inline: true },
                        { name: "Kết quả", value: elapsedNs.toLocaleString('vi-VN') + " ns", inline: true },
                        { name: "Sai lệch", value: offset.toLocaleString('vi-VN') + " ns", inline: true }
                    ],
                    timestamp: new Date().toISOString()
                }]
            };

            log("🔄 Đang gửi webhook...");
            log("URL: " + WEBHOOK_URL);

            fetch(WEBHOOK_URL, {
                method: "POST",
                headers: { 
                    "Content-Type": "application/json" 
                },
                body: JSON.stringify(payload)
            })
            .then(response => {
                log(`📡 Status: ${response.status} ${response.statusText}`);
                if (response.ok) {
                    log("✅ Gửi thành công!");
                } else if (response.status === 400) {
                    log("❌ Lỗi 400 - Payload không hợp lệ");
                }
                return response.text();
            })
            .then(text => {
                if (text) log("Response: " + text);
            })
            .catch(err => {
                log("❌ Lỗi fetch: " + err.message);
            });
        }

        btn.addEventListener("click", () => {
            debug.textContent = "";

            if (!running) {
                running = true;
                startInstant = Temporal.Now.instant();
                btn.textContent = "DỪNG";
                btn.className = "stop";
                result.innerHTML = "";
                updatePlaceholder();
                log("▶️ Bắt đầu thử thách");
            } else {
                running = false;
                cancelAnimationFrame(animationId);

                const endInstant = Temporal.Now.instant();
                const elapsedNs = Number(endInstant.since(startInstant).total({ unit: 'nanoseconds' }));
                const target = Number(targetSelect.value);
                const offset = Math.abs(elapsedNs - target);

                timer.textContent = elapsedNs.toLocaleString('vi-VN') + " ns";

                let rank, color;
                if (offset < 100_000)      { rank = "🏆 Xuất Shark! Chụp màn hình gửi tui kq nhé"; color = "#00ff88"; }
                else if (offset < 500_000)  { rank = "🥇 Tày rồi đó"; color = "#00ffcc"; }
                else if (offset < 10_000_000) { rank = "🥈 Rất tốt nhưng cần luyện tập thêm"; color = "#ffdd33"; }
                else if (offset < 100_000_000) { rank = "🥉 Cx kha khá"; color = "#ffaa33"; }
                else                          { rank = "Chưa Tày đâu =("; color = "#ff6666"; }

                result.innerHTML = `
                    <span style="color:${color}; font-size: 2rem;">${rank}</span><br><br>
                    <b>Mục tiêu:</b> <span style="color:#00ffcc">${target.toLocaleString('vi-VN')} ns</span><br>
                    <b>Kết quả:</b> <span style="color:#00ffcc">${elapsedNs.toLocaleString('vi-VN')} ns</span><br>
                    <b>Sai lệch:</b> <span style="color:#ffcc00">${offset.toLocaleString('vi-VN')} ns</span>
                `;

                sendToWebhook(offset, target, elapsedNs);

                btn.textContent = "CHƠI LẠI";
                btn.className = "start";
            }
        });
    </script>
</body>
</html>
