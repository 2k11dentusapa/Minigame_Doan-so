<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cổng Trò Chơi Trực Tuyến</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e1e2f, #252542);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #4facfe;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        p.subtitle {
            color: #a0a0c0;
            margin-bottom: 40px;
            font-size: 1.1rem;
        }

        /* Lưới chứa các nút bấm game */
        #game-menu {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            width: 100%;
        }

        /* Định dạng nút bấm được tạo từ JS */
        .game-btn {
            background: linear-gradient(90deg, #00f2fe, #4facfe);
            color: #ffffff;
            border: none;
            padding: 18px 25px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            text-align: center;
        }

        .game-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 242, 254, 0.5);
        }

        .game-btn:active {
            transform: translateY(-1px);
        }

        /* Trạng thái đang tải dữ liệu hoặc lỗi */
        .status-msg {
            font-style: italic;
            color: #ff4a4a;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Trung Tâm Trò Chơi</h1>
        <p class="subtitle">Chọn một trò chơi bên dưới để bắt đầu</p>
        
        <!-- Vùng chứa các nút bấm sẽ sinh ra từ JS -->
        <div id="game-menu">
            <p class="status-msg" id="loading-text" style="color: #a0a0c0;">Đang tải danh sách trò chơi...</p>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const menuContainer = document.getElementById("game-menu");
            const loadingText = document.getElementById("loading-text");

            // Gọi API lấy dữ liệu từ file JSON cục bộ
            fetch("game.json")
                .then(response => {
                    if (!response.ok) {
                        throw new Error("Không thể tải tập tin danh sách trò chơi.");
                    }
                    return response.json();
                })
                .then(gameData => {
                    // Xóa dòng chữ đang tải
                    loadingText.remove();

                    // Duyệt qua từng cặp key-value trong file JSON
                    Object.entries(gameData).forEach(([gameName, gameUrl]) => {
                        
                        // 1. Tạo phần tử nút bấm mới
                        const button = document.createElement("button");
                        
                        // 2. Cấu hình nội dung hiển thị và class định dạng
                        button.textContent = gameName;
                        button.className = "game-btn";
                        
                        // 3. Xử lý sự kiện click để điều hướng trực tiếp (Direct)
                        button.addEventListener("click", () => {
                            window.location.href = gameUrl;
                        });

                        // 4. Gắn nút bấm vào vùng chứa trên giao diện
                        menuContainer.appendChild(button);
                    });
                })
                .catch(error => {
                    console.error("Lỗi hệ thống:", error);
                    loadingText.textContent = "Không thể kết nối đến máy chủ game. Vui lòng thử lại sau!";
                });
        });
    </script>
</body>
</html>
